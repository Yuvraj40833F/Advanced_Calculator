<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adv Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="display-area">
            <input type="text" id="display" readonly>
        </div>
        <button class="scientific-toggle" 
                id="scientificToggle" 
                onclick="toggleScientific()">
                ▼
        </button>

        <div class="scientific-buttons" id="scientificButtons">
            <button class="operator" onclick="calculatePercentage()">%</button>
            <button class="operator" onclick="appendValue('**2')">x²</button>
            <button class="operator" onclick="squareRoot()">√</button>
            <button class="operator" onclick="appendValue('**')">^</button>
        </div>
        <div class="buttons">
            
            <button class="utility" onclick="clearDisplay()">AC</button>
            <button class="operator" onclick="appendParenthesis()">()</button>
            <button class="utility" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('00')">00</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
